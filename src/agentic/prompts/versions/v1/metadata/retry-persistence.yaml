name: retry-persistence
description: Adds retry context and persistence guidance for failed attempts
template_format: jinja2
version: 1.0.0
created_at: "2026-01-25T00:00:00Z"
updated_at: "2026-01-25T00:00:00Z"

changelog:
  - version: 1.0.0
    date: "2026-01-25"
    changes:
      - "Initial version extracted from code"
      - "Includes retry counter, strategies tried, and final attempt warnings"

variables:
  - name: CURRENT_ATTEMPT
    type: integer
    required: true
    description: "Current attempt number (1-10)"

  - name: MAX_RETRIES
    type: integer
    required: true
    description: "Maximum number of retries allowed (typically 10)"

  - name: REMAINING_MESSAGE
    type: string
    required: true
    description: "Message about remaining attempts"

  - name: PREVIOUS_ATTEMPTS
    type: boolean
    required: true
    description: "Whether there were previous failed attempts"

  - name: STRATEGIES_TRIED
    type: string
    required: false
    description: "Comma-separated list of strategies already attempted"

  - name: LAST_ERROR
    type: string
    required: false
    description: "Error message from last attempt"

  - name: FINAL_ATTEMPTS
    type: boolean
    required: true
    description: "Whether this is one of the final 3 attempts"

skills_referenced: []

performance_metrics:
  avg_success_rate: null
  avg_turns_used: null
  cost_per_invocation: null
