name: research-phase
description: Adds research phase requirements for vague/outcome-only tasks
template_format: jinja2
version: 1.0.0
created_at: "2026-01-25T00:00:00Z"
updated_at: "2026-01-25T00:00:00Z"

changelog:
  - version: 1.0.0
    date: "2026-01-25"
    changes:
      - "Initial version extracted from code"
      - "Includes research steps and Claude Code skills guidance"

variables:
  - name: INTENT_TYPE
    type: string
    required: true
    description: "Task intent classification (outcome_only, what_only, what_and_how)"

  - name: CONFIDENCE
    type: integer
    required: true
    description: "Classification confidence percentage (0-100)"

  - name: REASONING
    type: string
    required: true
    description: "Explanation of why this classification was chosen"

  - name: RESEARCH_QUESTIONS
    type: string
    required: true
    description: "Newline-separated list of research questions to answer"

skills_referenced:
  - prd-writer
  - project-architect
  - task-breakdown
  - project-analysis

performance_metrics:
  avg_success_rate: null
  avg_turns_used: null
  cost_per_invocation: null
