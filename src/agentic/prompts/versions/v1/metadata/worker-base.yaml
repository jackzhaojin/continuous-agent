name: worker-base
description: Base prompt for all worker agents executing tasks
template_format: jinja2
version: 1.0.0
created_at: "2026-01-25T00:00:00Z"
updated_at: "2026-01-25T00:00:00Z"

changelog:
  - version: 1.0.0
    date: "2026-01-25"
    changes:
      - "Initial version extracted from code"
      - "Includes Constitution limits"
      - "Execution guidelines"
      - "Output format requirements"

variables:
  - name: TASK_TITLE
    type: string
    required: true
    description: "Title of the task to execute"

  - name: PRIORITY
    type: string
    enum: ["P1", "P2", "P3"]
    required: true
    description: "Task priority level"

  - name: CONTRACT_ID
    type: string
    required: true
    description: "Unique contract identifier for traceability"

  - name: PROJECT_PATH
    type: string
    required: true
    description: "Absolute path to isolated project directory"

  - name: TOOLS_ALLOWED
    type: string
    required: true
    description: "Comma-separated list of available tools"

  - name: MAX_TURNS
    type: integer
    required: true
    description: "Maximum number of turns before timeout"

skills_referenced: []

performance_metrics:
  avg_success_rate: null  # To be measured
  avg_turns_used: null
  cost_per_invocation: null
