# Context Rules
# Defines what context to include for different task types
# Per PRD: Workers should get relevant context without overload

task_context_rules:
  # Next.js tasks get Next.js docs and patterns
  - task_pattern: "nextjs.*"
    include:
      - source: skills/technical-skills.yml
        filter: "nextjs.*"
      - source: skills/delivery-skills.yml
        filter: "deliver.nextjs.*"
      - source: references/sources/nextjs-docs
        paths:
          - docs/app/building-your-application/
          - docs/app/api-reference/
        max_tokens: 5000
    exclude:
      - "node_modules"
      - "*.lock"

  # Research/POC tasks get web access
  - task_pattern: "research.*|poc.*"
    include:
      - source: skills/functional-skills.yml
        filter: "reason.research.*"
      - tools:
          - WebSearch
          - WebFetch
    research_phase: required

  # Integration tasks get API context
  - task_pattern: "integration.*|api.*"
    include:
      - source: skills/technical-skills.yml
        filter: "*.api.*"
      - source: workspace/capabilities.md
        section: "Authentication Status"
    check_auth: true

  # Default context for any task
  - task_pattern: "*"
    always_include:
      - source: workspace/constitution.md
        summary: true
        max_tokens: 500
      - source: workspace/preferences.md
        max_tokens: 300
      - source: skills/functional-skills.yml
        filter: "reason.decomposition|exec.persistence"

# Prompt templates
prompt_templates:
  research_phase: |
    Before implementing, research:
    1. What are the best practices for this?
    2. Are there existing patterns to follow?
    3. What are the common pitfalls?
    Document findings before proceeding.

  persistence_reminder: |
    Remember: AI is smart. If something fails:
    - Understand WHY before retrying
    - Try a DIFFERENT approach
    - Break into smaller pieces if needed
    - You have {remaining_attempts} attempts left

  constitution_summary: |
    Constitutional Limits:
    - No spending > $20/service/month
    - No permanent deletions
    - No external publishing
    - No credential exposure
    - No access control expansion
    - All output to agent-outputs/
    - All activity logged
    - 10 retries before blocking
