metadata:
  category: technical
  description: Tool operation and technical execution capabilities
  version: 1.0.0
capabilities:
  - id: git.branch_commit
    name: Git Branch and Commit
    description: Create branches, stage changes, and commit with proper messages
    confidence: 50
    maturity: Demonstrated
    scope:
      includes:
        - Creating and switching branches
        - Staging files with git add
        - Creating commits with descriptive messages
        - Viewing git status and diff
        - Basic branch management
      excludes:
        - Complex merge conflict resolution
        - Interactive rebase
        - Git submodules
        - Git LFS operations
    prerequisites:
      - tool: git
        min_version: '2.0'
    verifiers:
      - git_status_check
      - commit_exists
    evidence:
      successes: 7
      failures: 45
      last_success: null
      last_failure: null
      last_validated: '2026-01-26'
    common_failure_modes:
      - Attempting to commit without staging
      - Branch name conflicts
      - Detached HEAD state confusion
    last_validated: null
    last_used: null
