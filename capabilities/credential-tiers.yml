# Credential Tiers Registry
#
# Three-tier classification for all environment variables and secrets.
# This registry is the source of truth for which credentials belong to which tier.
#
# Tier 1 (Executive): Keys the executive loop needs to orchestrate work.
#   - Always Node.js (runs via PM2 with dotenv)
#   - Loop timing, reporting integrations, breakdown config
#   - These stay in the executive process and are NOT copied to workers
#
# Tier 2 (Execution Agent): Keys worker agents need to execute tasks.
#   - Always Node.js (Claude Agent SDK today, possibly other agents later)
#   - Agent SDK authentication, model selection, tool-specific API keys
#   - Copied to agent-outputs/.env for workers
#
# Tier 3 (Application): Keys that built applications need to function.
#   - PLATFORM-AGNOSTIC: target projects can be Node.js, Python, Docker,
#     bash scripts, iOS apps, C++ builds, or anything else
#   - Prefixed with APP_ in the agent's .env for auto-detection
#   - Written to agent-outputs/.env.app as a KEY=VALUE transfer file
#     (APP_ prefix stripped so apps see standard names)
#   - Workers read .env.app and inject credentials into the project in
#     whatever format the platform requires:
#       Node.js / Ruby     → .env (dotenv)
#       Python             → .env or config.py
#       Docker             → docker-compose.yml environment block
#       Bash               → export KEY="VALUE" (sourced)
#       iOS (Xcode)        → .xcconfig or scheme env vars
#       C++ / CMake        → CMake cache vars or #define header
#       Kubernetes / Helm  → YAML values or secrets
#       JSON config        → config.json
#   - Multi-format export helpers in credential-tiers.ts:
#     formatAppEnv(pairs, 'dotenv' | 'json' | 'shell' | 'docker-compose' | 'yaml')
#
# Some keys are "shared" across tiers (e.g., ANTHROPIC_API_KEY is needed
# by both Tier 1 for diagnosis and Tier 2 for worker spawning).

version: 1

tiers:
  executive:
    description: "Executive loop orchestration — never leaves the agent process"
    variables:
      # Loop timing
      - name: IDLE_SLEEP_SECONDS
        description: "Sleep interval when no work is available"
        required: false
        default: "30"
      - name: UNHEALTHY_SLEEP_SECONDS
        description: "Sleep interval when system is unhealthy"
        required: false
        default: "60"

      # Goal breakdown configuration
      - name: BREAKDOWN_THRESHOLD_TURNS
        description: "Trigger auto-breakdown if estimated turns exceed this"
        required: false
        default: "100"
      - name: AUTO_BREAKDOWN_ENABLED
        description: "Enable/disable automatic goal breakdown"
        required: false
        default: "true"
      - name: MAX_TURNS
        description: "Max turns per single-step worker session"
        required: false
        default: "250"
      - name: MAX_TURNS_PER_STEP
        description: "Max turns per step in multi-step tasks (minimum 100)"
        required: false
        default: "100"

      # Notion reporting (executive-only integration)
      - name: NOTION_API_KEY
        description: "Notion integration token for milestone reporting"
        required: false
        secret: true
      - name: NOTION_DATABASE_ID
        description: "Notion database ID for agent milestones"
        required: false
      - name: NOTION_MONTHLY_PAGE_ID
        description: "Notion page ID for monthly summaries"
        required: false
      - name: NOTION_REPORTING_ENABLED
        description: "Kill switch for all Notion writes"
        required: false
        default: "true"

      # Infrastructure paths (typically in ecosystem.config.cjs, not .env)
      - name: AGENT_OUTPUTS_PATH
        description: "Path to agent-outputs directory"
        required: false
      - name: AGENT_PATH
        description: "Path to continuous-agent directory"
        required: false

  execution:
    description: "Execution agent credentials (always Node.js) — copied to worker .env"
    variables:
      # Agent SDK authentication (shared with executive for diagnosis)
      - name: CLAUDE_CODE_OAUTH_TOKEN
        description: "OAuth token for Claude Code (Pro/Max subscription)"
        required: false  # One of OAuth or API key is required
        secret: true
        shared_with: [executive]
      - name: ANTHROPIC_API_KEY
        description: "Anthropic API key for Claude Agent SDK"
        required: false  # One of OAuth or API key is required
        secret: true
        shared_with: [executive]

      # Model configuration (shared with executive)
      - name: MODEL
        description: "Claude model to use for worker sessions"
        required: false
        default: "claude-sonnet-4-5"
        shared_with: [executive]

      # Execution-agent-specific tool keys
      - name: ELEVENLABS_API_KEY
        description: "ElevenLabs TTS API key (used by demo video skill)"
        required: false
        secret: true

      # Future execution agent keys would go here:
      # - name: OPENAI_API_KEY
      #   description: "OpenAI API key (for future GPT-based execution agents)"
      # - name: GEMINI_API_KEY
      #   description: "Google Gemini API key (for future Gemini-based execution agents)"

  application:
    description: "Application credentials (platform-agnostic) — .env.app transfer file, workers inject per-platform"
    auto_prefix: "APP_"  # Any env var starting with APP_ is auto-classified here
    variables:
      # Databases
      - name: APP_DATABASE_URL
        description: "Primary database connection string (PostgreSQL, MySQL, etc.)"
        required: false
        secret: true
      - name: APP_MONGODB_URI
        description: "MongoDB connection URI"
        required: false
        secret: true
      - name: APP_REDIS_URL
        description: "Redis connection URL"
        required: false
        secret: true

      # Payment
      - name: APP_STRIPE_SECRET_KEY
        description: "Stripe secret key for payment processing"
        required: false
        secret: true
      - name: APP_STRIPE_PUBLISHABLE_KEY
        description: "Stripe publishable key (safe for client-side)"
        required: false

      # Email
      - name: APP_SENDGRID_API_KEY
        description: "SendGrid API key for transactional email"
        required: false
        secret: true
      - name: APP_RESEND_API_KEY
        description: "Resend API key for email"
        required: false
        secret: true

      # Cloud / Storage
      - name: APP_AWS_ACCESS_KEY_ID
        description: "AWS access key ID"
        required: false
        secret: true
      - name: APP_AWS_SECRET_ACCESS_KEY
        description: "AWS secret access key"
        required: false
        secret: true
      - name: APP_AWS_REGION
        description: "AWS region"
        required: false
        default: "us-east-1"
      - name: APP_S3_BUCKET
        description: "S3 bucket name for file storage"
        required: false

      # Authentication
      - name: APP_JWT_SECRET
        description: "JWT signing secret for app authentication"
        required: false
        secret: true
      - name: APP_NEXTAUTH_SECRET
        description: "NextAuth.js secret"
        required: false
        secret: true
      - name: APP_NEXTAUTH_URL
        description: "NextAuth.js URL"
        required: false

      # AI/ML (keys the app itself uses, distinct from execution agent keys)
      - name: APP_OPENAI_API_KEY
        description: "OpenAI API key for app features (chat, embeddings, etc.)"
        required: false
        secret: true
      - name: APP_ANTHROPIC_API_KEY
        description: "Anthropic API key for app features"
        required: false
        secret: true

      # Misc services
      - name: APP_SUPABASE_URL
        description: "Supabase project URL"
        required: false
      - name: APP_SUPABASE_ANON_KEY
        description: "Supabase anonymous key"
        required: false
        secret: true
      - name: APP_FIREBASE_PROJECT_ID
        description: "Firebase project ID"
        required: false
