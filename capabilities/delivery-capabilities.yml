        - bash.script_execution
        - yaml.parse_manipulate
      functional:
        - reason.decomposition
        - reason.debugging.discipline
        - comm.documentation
    dod_template:
      required:
        - SKILL.md has valid frontmatter (name ≤64 chars, description ≤1024 chars)
        - Instructions are self-contained and actionable
        - Skill invokable via Skill tool
        - All referenced files exist
        - Tested end-to-end with at least one scenario
        - Committed to git on a branch
      recommended:
        - Error handling documented
        - Multiple test scenarios validated
        - Supporting scripts are executable
        - References to existing skill patterns
    evidence:
      successes: 6
      failures: 1
      last_success: null
      last_failure: null
      last_validated: '2026-02-02'
    common_failure_modes:
      - Invalid frontmatter format
      - Description exceeds 1024 char limit
      - Referenced scripts not executable
      - Instructions assume context not available to skill reader
      - Skill not discoverable due to missing trigger phrases
    last_validated: null
    last_used: null
