  - id: deliver.claude.skill
    name: Claude Code Skill Delivery
    description: Deliver a tested Claude Code skill with SKILL.md, optional scripts, templates, and references
    confidence: 75
    maturity: Reliable
    scope:
      includes:
        - SKILL.md creation with valid frontmatter
        - Supporting scripts and templates
        - Reference materials
        - Build-test-fix iteration loop
        - Format and functional validation
      excludes:
        - Skills requiring external paid APIs without approval
        - Skills that modify constitution.md
        - Skills for other AI platforms
