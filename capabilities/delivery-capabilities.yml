  - id: deliver.site.static
    name: Static Site Delivery
    description: Deliver a complete static website from scratch to deployment
    confidence: 85
    maturity: Demonstrated
    scope:
      includes:
        - HTML/CSS/JS static sites
        - Basic build tooling setup
        - Static hosting deployment
        - Asset optimization
      excludes:
        - Dynamic server-side rendering
        - Database integration
        - Complex authentication
    requires_capabilities:
      technical:
        - file.read_write
        - git.branch_commit
        - bash.script_execution
      functional:
        - reason.decomposition
        - comm.documentation
    dod_template:
      required:
        - Site builds without errors
        - All pages render correctly
        - Assets load properly
        - Site deployed and accessible
      recommended:
        - Performance score > 80
        - Mobile responsive
        - Basic SEO meta tags
    evidence:
      successes: 0
      failures: 0
      last_success: null
      last_failure: null
    common_failure_modes:
      - Asset path resolution issues
      - Build configuration errors
      - Deployment credential issues
    last_validated: null
    last_used: null
