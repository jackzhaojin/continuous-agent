<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Agent Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #2a2a2a;
        }

        .card h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 15px;
        }

        .status-healthy { color: #22c55e; }
        .status-degraded { color: #eab308; }
        .status-unhealthy { color: #ef4444; }

        .health-grid {
            display: grid;
            gap: 10px;
        }

        .health-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #222;
            border-radius: 4px;
        }

        .health-item .name {
            font-weight: 500;
        }

        .health-item .status {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
        }

        .health-item .status.pass {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .health-item .status.fail {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .skill-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skill-item {
            padding: 12px;
            background: #222;
            border-radius: 4px;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .skill-name {
            font-weight: 500;
            font-family: monospace;
        }

        .skill-confidence {
            font-weight: 600;
        }

        .confidence-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #22c55e);
            transition: width 0.3s ease;
        }

        .maturity-badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
        }

        .maturity-declared {
            background: rgba(107, 114, 128, 0.3);
            color: #9ca3af;
        }

        .maturity-demonstrated {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .maturity-reliable {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            padding: 12px;
            background: #222;
            border-radius: 4px;
            border-left: 3px solid;
        }

        .task-item.priority-P1 { border-color: #ef4444; }
        .task-item.priority-P2 { border-color: #eab308; }
        .task-item.priority-P3 { border-color: #3b82f6; }

        .task-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .task-meta {
            font-size: 12px;
            color: #888;
        }

        .task-status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 8px;
        }

        .task-status.in-progress {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .task-status.blocked {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .task-status.pending {
            background: rgba(107, 114, 128, 0.3);
            color: #9ca3af;
        }

        .validation-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .validation-item {
            padding: 12px;
            background: #222;
            border-radius: 4px;
        }

        .validation-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .validation-result {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
        }

        .validation-result.pass {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .validation-result.fail {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .validation-result.partial {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .timestamp {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .refresh-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Continuous Executive Agent</h1>

        <div class="grid">
            <!-- Health Status -->
            <div class="card">
                <h2>Health Status</h2>
                <div class="health-grid" id="health-status">
                    <div class="empty-state">Loading health data...</div>
                </div>
            </div>

            <!-- Skill Confidence -->
            <div class="card">
                <h2>Skill Confidence</h2>
                <div class="skill-list" id="skill-list">
                    <div class="empty-state">Loading skills...</div>
                </div>
            </div>

            <!-- Active/Blocked Tasks -->
            <div class="card">
                <h2>Active Tasks</h2>
                <div class="task-list" id="task-list">
                    <div class="empty-state">Loading tasks...</div>
                </div>
            </div>

            <!-- Recent Validations -->
            <div class="card">
                <h2>Recent Validations</h2>
                <div class="validation-list" id="validation-list">
                    <div class="empty-state">Loading validations...</div>
                </div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadAllData()">Refresh</button>

    <script>
        // Sample data - in production, this would be loaded from files
        const sampleHealth = {
            overall: 'healthy',
            checks: [
                { name: 'github-cli', status: 'pass', message: 'GitHub CLI authenticated' },
                { name: 'disk-space', status: 'pass', message: 'Disk usage: 45% used, 120GB available' },
                { name: 'node-version', status: 'pass', message: 'Node.js v20.10.0' },
                { name: 'reference-integrity', status: 'pass', message: 'Registry and filesystem consistent' }
            ]
        };

        const sampleSkills = [
            { id: 'git.branch_commit', confidence: 85, maturity: 'Reliable' },
            { id: 'node.npm.install', confidence: 90, maturity: 'Reliable' },
            { id: 'node.npm.run_script', confidence: 75, maturity: 'Demonstrated' },
            { id: 'nextjs.build.basic', confidence: 60, maturity: 'Demonstrated' },
            { id: 'nextjs.routing.app_router', confidence: 40, maturity: 'Declared' },
            { id: 'comm.documentation', confidence: 70, maturity: 'Demonstrated' }
        ];

        const sampleTasks = [
            { title: 'Implement executive loop validation', priority: 'P1', status: 'In Progress' },
            { title: 'Wire up skill updater', priority: 'P1', status: 'Pending' },
            { title: 'Create dashboard', priority: 'P2', status: 'In Progress' },
            { title: 'Setup PM2 config', priority: 'P3', status: 'Blocked' }
        ];

        const sampleValidations = [
            { task: 'Test verifiers', result: 'PASS', timestamp: '2024-01-15 14:30:00', pass: 7, fail: 0 },
            { task: 'Build executive loop', result: 'PARTIAL', timestamp: '2024-01-15 13:45:00', pass: 5, fail: 2 },
            { task: 'Setup project', result: 'PASS', timestamp: '2024-01-15 12:00:00', pass: 6, fail: 0 }
        ];

        function renderHealth(data) {
            const container = document.getElementById('health-status');
            if (!data || !data.checks) {
                container.innerHTML = '<div class="empty-state">No health data available</div>';
                return;
            }

            container.innerHTML = data.checks.map(check => `
                <div class="health-item">
                    <span class="name">${check.name}</span>
                    <span class="status ${check.status}">${check.status.toUpperCase()}</span>
                </div>
            `).join('');
        }

        function renderSkills(skills) {
            const container = document.getElementById('skill-list');
            if (!skills || skills.length === 0) {
                container.innerHTML = '<div class="empty-state">No skills registered</div>';
                return;
            }

            container.innerHTML = skills
                .sort((a, b) => a.confidence - b.confidence)
                .slice(0, 8)
                .map(skill => `
                    <div class="skill-item">
                        <div class="skill-header">
                            <span>
                                <span class="skill-name">${skill.id}</span>
                                <span class="maturity-badge maturity-${skill.maturity.toLowerCase()}">${skill.maturity}</span>
                            </span>
                            <span class="skill-confidence">${skill.confidence}%</span>
                        </div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${skill.confidence}%"></div>
                        </div>
                    </div>
                `).join('');
        }

        function renderTasks(tasks) {
            const container = document.getElementById('task-list');
            if (!tasks || tasks.length === 0) {
                container.innerHTML = '<div class="empty-state">No active tasks</div>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-item priority-${task.priority}">
                    <div class="task-title">
                        ${task.title}
                        <span class="task-status ${task.status.toLowerCase().replace(' ', '-')}">${task.status}</span>
                    </div>
                    <div class="task-meta">Priority: ${task.priority}</div>
                </div>
            `).join('');
        }

        function renderValidations(validations) {
            const container = document.getElementById('validation-list');
            if (!validations || validations.length === 0) {
                container.innerHTML = '<div class="empty-state">No validation results</div>';
                return;
            }

            container.innerHTML = validations.map(v => `
                <div class="validation-item">
                    <div class="validation-header">
                        <span>${v.task}</span>
                        <span class="validation-result ${v.result.toLowerCase()}">${v.result}</span>
                    </div>
                    <div class="timestamp">${v.timestamp} - ${v.pass} passed, ${v.fail} failed</div>
                </div>
            `).join('');
        }

        function loadAllData() {
            // In production, these would be async fetches from JSON files
            // For now, use sample data
            renderHealth(sampleHealth);
            renderSkills(sampleSkills);
            renderTasks(sampleTasks);
            renderValidations(sampleValidations);
        }

        // Initial load
        loadAllData();

        // Auto-refresh every 30 seconds
        setInterval(loadAllData, 30000);
    </script>
</body>
</html>
