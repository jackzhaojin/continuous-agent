# Decision tree reference (see strategies/reference-intake-policy.yaml)
decision_tree_summary: |
  1. Just reading/searching? -> Mode A: Pinned Clone
  2. Can fix at runtime (wrapper)? -> Mode A + Wrapper
  3. Small source fix needed (< 3 patches)? -> Mode B: Clone + Patches
  4. Multi-project dependency or ongoing changes? -> Mode C: Fork

  DEFAULT: Always start with Mode A, upgrade only when evidence requires

