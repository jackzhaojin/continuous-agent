    # Lifecycle
    acquired_at: "2026-01-25T00:00:00Z"
    last_refresh: "2026-01-25T00:00:00Z"
    refresh_policy: manual

    # Purpose
    purpose: |
      POC validating Claude Agent SDK subagent capabilities via Task tool.
      KEY LEARNINGS:
      - allowedTools must include 'Task' to enable subagent delegation
      - settingSources: ['user', 'project'] loads agents from filesystem
      - User-level agents (~/.claude/agents/) discovered and invocable
      - Project-level agents (.claude/agents/) discovered and invocable
      - Subagents defined as *.md files with YAML frontmatter
      - Custom subagents can specify: tools, model, permissionMode, hooks, skills
      - Built-in subagents: Explore (haiku), Plan, general-purpose, Bash
      - Subagents run in isolated context, return results to main agent
      - Subagents CANNOT spawn other subagents (no nesting)
      - Agent priority: CLI flag > project > user > plugin
      VALIDATED: 4/4 core tests + user-level agent invocation (jack-web-build-and-test-v1)
    skills_using:
      - node.npm.install

    patches: []
    wrappers: []

