# SDK Registry
# Tracks which SDKs can execute which skills
# Per PRD 2.2: Different SDKs have different capabilities

sdks:
  claude_agent_sdk:
    name: "Claude Agent SDK"
    cost_estimate: "$100/month"
    capabilities:
      - skill_tool: true         # Can invoke SKILL.md files
      - settings_sources: true   # Can use ['user', 'project']
      - project_skills: true     # Can load .claude/skills/
      - user_skills: true        # Can load ~/.claude/skills/
      - allowed_tools: true      # Granular tool control
      - max_turns: true          # Turn limit control
    best_for:
      - "Complex multi-skill tasks"
      - "Tasks needing SKILL.md"
      - "Full harness execution"
    constraints:
      - "Higher cost per call"

  codex_cli:
    name: "Codex CLI (Headless)"
    cost_estimate: "$35/month"
    capabilities:
      - skill_tool: false        # Cannot invoke SKILL.md
      - settings_sources: false  # Different config model
      - project_skills: false    # No bundled skills
      - user_skills: false       # Different user config
      - allowed_tools: partial   # Different tool model
      - max_turns: partial       # Different limits
    best_for:
      - "Simple bash/code tasks"
      - "Cost-sensitive work"
      - "Parallel simple workers"
    constraints:
      - "No Skill tool access"
      - "Limited to basic operations"

# Skill SDK compatibility
# When a skill requires SKILL.md, it can only run on claude_agent_sdk
skill_requirements:
  requires_skill_tool:
    - "harness.*"              # All harness skills need Skill tool
    - "calibration.*"          # Calibration projects
    - "executive.*"            # Executive loop skills

  works_on_any_sdk:
    - "git.*"                  # Pure tool operations
    - "node.*"                 # NPM/Node operations
    - "files.*"                # File operations
    - "bash.*"                 # Shell commands
