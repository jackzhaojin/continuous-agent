# Technical Skills Registry
# Tool/interface operation capabilities
# Confidence: 0-100 (evidence-weighted)
# Maturity: Declared → Demonstrated → Reliable

skills:
  # Git Operations
  - id: git.branch_commit
    name: "Git Branch and Commit"
    description: "Create branches, make commits, manage history"
    confidence: 85
    maturity: Demonstrated
    scope:
      includes:
        - "create branches"
        - "make commits"
        - "view history"
        - "merge (simple)"
      excludes:
        - "rebase (complex)"
        - "conflict resolution"
    verifiers:
      - git_status_clean
      - commit_exists
    evidence:
      successes: 10
      failures: 1
      last_validated: null

  - id: github.pr.create
    name: "GitHub Pull Request"
    description: "Create and manage pull requests via gh CLI"
    confidence: 80
    maturity: Demonstrated
    scope:
      includes:
        - "create PR"
        - "add description"
        - "request review"
      excludes:
        - "merge conflicts"
        - "complex reviews"
    verifiers:
      - git_status_clean
    evidence:
      successes: 5
      failures: 0
      last_validated: null

  # Node.js Operations
  - id: node.npm.install
    name: "NPM Install"
    description: "Install npm dependencies"
    confidence: 90
    maturity: Reliable
    scope:
      includes:
        - "npm install"
        - "npm ci"
        - "add dependencies"
    verifiers:
      - node_install
    evidence:
      successes: 20
      failures: 2
      last_validated: null

  - id: node.npm.run_script
    name: "NPM Run Script"
    description: "Execute package.json scripts"
    confidence: 85
    maturity: Demonstrated
    scope:
      includes:
        - "npm run build"
        - "npm run test"
        - "npm run dev"
    verifiers:
      - node_build
      - node_test
    evidence:
      successes: 15
      failures: 3
      last_validated: null

  # Next.js Operations
  - id: nextjs.build.basic
    name: "Next.js Basic Build"
    description: "Scaffold and build a basic Next.js app"
    confidence: 60
    maturity: Declared
    scope:
      includes:
        - "create-next-app"
        - "basic pages"
        - "simple components"
        - "npm run build"
      excludes:
        - "complex routing"
        - "authentication"
        - "database integration"
        - "deployment"
    prerequisites:
      - tool: node
        min_version: "18.0.0"
    verifiers:
      - node_install
      - node_build
      - files_exist
    common_failure_modes:
      - "TypeScript configuration issues"
      - "Missing dependencies"
      - "Import path errors"
    evidence:
      successes: 1
      failures: 3
      last_validated: null

  - id: nextjs.routing.app_router
